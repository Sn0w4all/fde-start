<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>project_2 — разбор кода</title>
<style>
:root{--bg:#0f1419;--bg-card:#1a2028;--bg-code:#11161c;--bg-hover:#232b35;--border:#2a3440;--text:#d7dce2;--text-dim:#8b97a5;--accent:#5ec8a8;--accent-2:#7aa2e3;--accent-3:#e0a458;--kw:#c98fd4;--str:#8fc98f;--com:#5f6b78;--fn:#7aa2e3}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.65;font-size:16px}
.layout{display:flex;max-width:1400px;margin:0 auto}
.sidebar{width:260px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--border);padding:20px 14px;background:var(--bg)}
.sidebar h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin:16px 0 5px;font-weight:600}.sidebar h2:first-child{margin-top:0}
.nav-link{display:block;padding:5px 10px;color:var(--text-dim);border-radius:6px;font-size:13px;cursor:pointer;border:none;background:none;text-align:left;width:100%;font-family:inherit}
.nav-link:hover{background:var(--bg-hover);color:var(--text)}.nav-link.active{background:var(--bg-hover);color:var(--accent)}
.main{flex:1;padding:32px 44px;max-width:900px;overflow-x:hidden}
.section{display:none}.section.visible{display:block;animation:fade .2s ease}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.crumb{font-size:13px;color:var(--text-dim);margin-bottom:16px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.crumb button,.crumb-link{background:none;border:none;color:var(--accent-2);cursor:pointer;font-size:13px;padding:0;font-family:inherit}.crumb button:hover,.crumb-link:hover{text-decoration:underline}
h1{font-size:26px;margin-bottom:5px;font-weight:650}.file-tag{color:var(--accent);font-family:"SF Mono",Menlo,monospace;font-size:20px}
.subtitle{color:var(--text-dim);margin-bottom:24px;font-size:15px}h3{font-size:18px;margin:26px 0 10px;font-weight:600;padding-bottom:5px;border-bottom:1px solid var(--border)}
h4{font-size:15px;margin:20px 0 7px;color:var(--accent);font-weight:600}p{margin-bottom:12px}ul,ol{margin:0 0 12px 20px}li{margin-bottom:5px}
code.inline{background:var(--bg-code);padding:2px 6px;border-radius:4px;font-family:"SF Mono",Menlo,monospace;font-size:13px;color:var(--accent-3)}
pre{background:var(--bg-code);border:1px solid var(--border);border-radius:8px;padding:14px 16px;overflow-x:auto;margin:0 0 14px;font-size:13px;line-height:1.5}pre code{font-family:"SF Mono",Menlo,monospace}
.kw{color:var(--kw)}.str{color:var(--str)}.com{color:var(--com);font-style:italic}.fn{color:var(--fn)}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.card-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.mc{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:border-color .15s,transform .1s;text-align:left;font-family:inherit;color:var(--text);display:block;width:100%}
.mc:hover{border-color:var(--accent);transform:translateY(-2px)}.mc-title{font-family:"SF Mono",Menlo,monospace;color:var(--accent);font-size:14px;margin-bottom:5px;font-weight:600}.mc-desc{font-size:12.5px;color:var(--text-dim)}
.layer{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:4px;margin-bottom:8px;font-weight:600}
.layer-bot{background:rgba(94,200,168,.15);color:var(--accent)}.layer-core{background:rgba(201,143,212,.15);color:var(--kw)}
.callout{border-left:3px solid var(--accent-2);background:rgba(122,162,227,.08);padding:11px 14px;border-radius:0 8px 8px 0;margin-bottom:14px}
.callout.why{border-color:var(--accent);background:rgba(94,200,168,.08)}.callout.warn{border-color:var(--accent-3);background:rgba(224,164,88,.08)}
.ctitle{font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;color:var(--text-dim)}
.chip-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}.chip{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:3px 11px;font-size:12.5px;cursor:pointer;color:var(--accent-2)}.chip:hover{border-color:var(--accent-2)}
.arch-flow{font-family:"SF Mono",Menlo,monospace;font-size:12.5px;background:var(--bg-code);border:1px solid var(--border);border-radius:8px;padding:16px;white-space:pre;overflow-x:auto;color:var(--text-dim);margin-bottom:14px}
dl.term dt{font-weight:600;color:var(--accent);margin-top:14px;font-family:"SF Mono",Menlo,monospace;font-size:14px}dl.term dd{margin:3px 0 0;color:var(--text)}
@media(max-width:800px){.sidebar{display:none}.main{padding:16px}}
</style>
</head>
<body>
<div class="layout">
<nav class="sidebar" id="sb"></nav>
<main class="main" id="main"></main>
</div>
<script>
const NAV=[
  {g:"Обзор",items:[{id:"overview",label:"Что это за проект"},{id:"architecture",label:"Архитектура"},{id:"req-flow",label:"Путь одного запроса"}]},
  {g:"Модули — bot/",items:[{id:"m-routing",label:"routing.py"},{id:"m-queue",label:"queue.py"},{id:"m-config",label:"config.py"},{id:"m-handlers",label:"handlers.py"}]},
  {g:"Модули — core/",items:[{id:"m-pipeline",label:"pipeline.py"},{id:"m-llm",label:"llm.py"},{id:"m-render",label:"render.py"},{id:"m-compare",label:"compare.py"},{id:"m-htmlutils",label:"html_utils.py"},{id:"m-retry",label:"retry.py"}]},
  {g:"Концепции — bot/",items:[{id:"c-async",label:"async / await"},{id:"c-enum",label:"Enum и наследование"},{id:"c-di",label:"Dependency injection"},{id:"c-singleton",label:"Модуль как синглтон"},{id:"c-closure",label:"Замыкания"},{id:"c-pydantic",label:"pydantic-settings"},{id:"c-firefor",label:"Fire-and-forget"}]},
  {g:"Концепции — core/",items:[{id:"c-promptcache",label:"Prompt caching"},{id:"c-conversation",label:"Многооборотный разговор"},{id:"c-cheapgate",label:"Cheap gate"},{id:"c-typevar",label:"TypeVar"}]},
  {g:"Справка",items:[{id:"glossary",label:"Словарь терминов"}]},
];
const C={};
C["overview"]={crumb:[],title:"Что это за проект",file:"",subtitle:"HTML Bot — stateless Telegram-агент.",body:"\n<p>Telegram-бот принимает текст и/или картинку и возвращает самодостаточный HTML-файл плюс PNG-превью. История диалога не хранится — каждый запрос обрабатывается независимо.</p>\n<h3>Три варианта входа</h3>\n<div class=\"card\">\n<p><b>Только текст</b> → ветка TEXT2HTML. Claude генерирует HTML, тот рендерится и валидируется (до 2 повторов).</p>\n<p><b>Только фото</b> → ветка IMG2HTML. Vision-реконструкция → рендер → диагностика по тайлам → итеративная коррекция.</p>\n<p><b>Текст + фото</b> → обе ветки, оба результата.</p>\n</div>\n<h3>Стек</h3>\n<div class=\"chip-row\">\n<span class=\"chip\" onclick=\"show('c-async')\">Python 3.12 &middot; asyncio</span>\n<span class=\"chip\" onclick=\"show('m-handlers')\">aiogram 3 (long-polling)</span>\n<span class=\"chip\">aiosqlite</span><span class=\"chip\">anthropic SDK</span>\n<span class=\"chip\">Playwright (Chromium)</span><span class=\"chip\">Pillow</span>\n<span class=\"chip\" onclick=\"show('c-pydantic')\">pydantic-settings</span><span class=\"chip\">structlog</span>\n</div>\n<h3>С чего начать</h3>\n<p>Начни с <button class=\"crumb-link\" onclick=\"show('architecture')\">архитектуры</button>, затем модули bot/ в порядке routing &rarr; queue &rarr; config &rarr; handlers, затем core/ в порядке retry &rarr; html_utils &rarr; render &rarr; compare &rarr; llm &rarr; pipeline.</p>\n"};
C["architecture"]={crumb:[['overview', 'Обзор']],title:"Архитектура",file:"",subtitle:"Три слоя, одно правило: нижний слой не знает о верхнем.",body:"\n<div class=\"arch-flow\">                 Telegram\n                    | long-polling (aiogram 3)\n                    v\n +-------------------------------------------------+\n |  main.py -- wires deps, lifecycle, polling      |\n +----------+------------------------------+--------+\n            |                              |\n     bot/ (I/O edge)              core/ (generation)\n            |                              |\n  handlers routing queue       pipeline llm render\n                                compare html_utils retry\n            |                              |\n     storage/db.py             Anthropic API . Chromium</div>\n<h3>Слой bot/</h3>\n<span class=\"layer layer-bot\">I/O edge</span>\n<p>Знает только про Telegram: принять сообщение, проверить авторизацию, поставить в очередь, отправить ответ.</p>\n<div class=\"card-grid\">\n<button class=\"mc\" onclick=\"show('m-handlers')\"><div class=\"mc-title\">handlers.py</div><div class=\"mc-desc\">команды, auth gate, диспетчеризация, отправка</div></button>\n<button class=\"mc\" onclick=\"show('m-routing')\"><div class=\"mc-title\">routing.py</div><div class=\"mc-desc\">чистая логика маршрутизации входа</div></button>\n<button class=\"mc\" onclick=\"show('m-queue')\"><div class=\"mc-title\">queue.py</div><div class=\"mc-desc\">очередь с ограничением параллелизма</div></button>\n<button class=\"mc\" onclick=\"show('m-config')\"><div class=\"mc-title\">config.py</div><div class=\"mc-desc\">настройки из .env</div></button>\n</div>\n<h3>Слой core/</h3>\n<span class=\"layer layer-core\">generation</span>\n<p>Чистая логика генерации — ничего не знает о Telegram. Принимает текст и байты, возвращает HTML и PNG.</p>\n<div class=\"card-grid\">\n<button class=\"mc\" onclick=\"show('m-pipeline')\"><div class=\"mc-title\">pipeline.py</div><div class=\"mc-desc\">оркестрация двух веток генерации</div></button>\n<button class=\"mc\" onclick=\"show('m-llm')\"><div class=\"mc-title\">llm.py</div><div class=\"mc-desc\">вызовы Claude + prompt caching</div></button>\n<button class=\"mc\" onclick=\"show('m-render')\"><div class=\"mc-title\">render.py</div><div class=\"mc-desc\">Chromium рендер + валидация</div></button>\n<button class=\"mc\" onclick=\"show('m-compare')\"><div class=\"mc-title\">compare.py</div><div class=\"mc-desc\">тайловая диагностика изображений</div></button>\n<button class=\"mc\" onclick=\"show('m-htmlutils')\"><div class=\"mc-title\">html_utils.py</div><div class=\"mc-desc\">очистка вывода модели</div></button>\n<button class=\"mc\" onclick=\"show('m-retry')\"><div class=\"mc-title\">retry.py</div><div class=\"mc-desc\">экспоненциальный backoff</div></button>\n</div>\n<div class=\"callout why\"><div class=\"ctitle\">Зачем три слоя</div>\nSeparation of Concerns. Если заменить Telegram на веб-сервер — core/ трогать не нужно. Тесты на core/ пишутся без моков Telegram.</div>\n"};
C["req-flow"]={crumb:[['overview', 'Обзор'], ['architecture', 'Архитектура']],title:"Путь одного запроса",file:"",subtitle:"От сообщения в Telegram до файлов в ответе.",body:"\n<div class=\"arch-flow\">Пользователь прислал картинку\n  |\nhandlers.on_content()\n  +-- проверка авторизации    -> storage/db.py\n  +-- route_input(...)        -> bot/routing.py\n  +-- answer(\"Got it...\")\n  +-- queue.submit(lambda: _process(...))\n      |  <- возвращает МГНОВЕННО, бот свободен\n      v\nqueue._run()  (в фоне)\n  +-- async with semaphore    <- макс 3 одновременно\n  +-- asyncio.wait_for(_process(), timeout=600)\n      |\n      v\n_process()\n  +-- скачивает фото\n  +-- pipeline.run_img2html() -> core/ -> Claude -> Chromium\n  +-- _send_artifact()        -> .html + .png в Telegram\n      |\n      v\nслот освобождается -> следующая задача в очереди</div>\n<div class=\"callout\"><div class=\"ctitle\">Ключевая идея</div>\nРазделены два момента: <b>когда пользователь получает подтверждение</b> (мгновенно) и <b>когда запрос реально обрабатывается</b> (через очередь, не более 3 одновременно).</div>\n<p>Подробнее:\n<button class=\"crumb-link\" onclick=\"show('c-async')\">async/await</button> &middot;\n<button class=\"crumb-link\" onclick=\"show('c-firefor')\">fire-and-forget</button> &middot;\n<button class=\"crumb-link\" onclick=\"show('m-queue')\">queue.py</button></p>\n"};
C["m-routing"]={crumb:[['architecture', 'Архитектура']],title:"Маршрутизация входа",file:"bot/routing.py",subtitle:"22 строки, три важные идеи. Чистая функция без зависимостей.",body:"\n<h4>Предназначение и связи</h4>\n<p>Решает по наличию текста/картинки какую ветку запустить. Вынесено в отдельный файл ради тестируемости — логику можно проверить без запущенного бота.</p>\n<pre><code><span class=\"kw\">class</span> <span class=\"fn\">Route</span>(<span class=\"kw\">str</span>, Enum):\n    TEXT2HTML = <span class=\"str\">\"text2html\"</span>\n    IMG2HTML  = <span class=\"str\">\"img2html\"</span>\n    BOTH      = <span class=\"str\">\"both\"</span>\n    EMPTY     = <span class=\"str\">\"empty\"</span>\n\n<span class=\"kw\">def</span> <span class=\"fn\">route_input</span>(*, has_text: <span class=\"kw\">bool</span>, has_image: <span class=\"kw\">bool</span>) -&gt; Route:\n    <span class=\"kw\">if</span> has_text <span class=\"kw\">and</span> has_image: <span class=\"kw\">return</span> Route.BOTH\n    <span class=\"kw\">if</span> has_image: <span class=\"kw\">return</span> Route.IMG2HTML\n    <span class=\"kw\">if</span> has_text:  <span class=\"kw\">return</span> Route.TEXT2HTML\n    <span class=\"kw\">return</span> Route.EMPTY</code></pre>\n<h4>Enum вместо строк</h4>\n<p>Возвращать голую строку опасно: опечатку Python не поймает. Enum даёт fail-fast. <button class=\"crumb-link\" onclick=\"show('c-enum')\">Почему class Route(str, Enum) &rarr;</button></p>\n<h4>Keyword-only через *</h4>\n<p>Звёздочка заставляет передавать аргументы по имени: <code class=\"inline\">route_input(has_text=True, has_image=False)</code>. Два булевых рядом — классическая ловушка.</p>\n<div class=\"callout why\"><div class=\"ctitle\">Зачем выносить 6 строк в отдельный файл</div>\nНет побочных эффектов: получает два bool, возвращает Route. Тестируется одной строкой без Telegram и БД.</div>\n"};
C["m-queue"]={crumb:[['architecture', 'Архитектура']],title:"Очередь задач",file:"bot/queue.py",subtitle:"Ограничивает параллелизм: принимаем всё, обрабатываем не более N сразу.",body:"\n<h4>Предназначение и связи</h4>\n<p>Создаётся один раз в <code class=\"inline\">main.py</code>, передаётся в <button class=\"crumb-link\" onclick=\"show('m-handlers')\">handlers</button> через <button class=\"crumb-link\" onclick=\"show('c-di')\">Deps</button>. Решает проблему: 10 пользователей сразу не должны положить Chromium и упереться в rate limit.</p>\n<h4>Semaphore — турникет</h4>\n<pre><code>self._sem = asyncio.Semaphore(max_concurrent)\n<span class=\"com\"># Semaphore(3) — пропускает макс 3 одновременно, остальные ждут</span></code></pre>\n<h4>_run — где вся работа</h4>\n<pre><code><span class=\"kw\">async with</span> self._sem:             <span class=\"com\"># ждём слот ЗДЕСЬ</span>\n    <span class=\"kw\">try</span>:\n        <span class=\"kw\">await</span> asyncio.wait_for(coro_factory(), timeout=self._timeout)\n    <span class=\"kw\">except</span> asyncio.TimeoutError: reason = <span class=\"str\">\"timeout\"</span>\n    <span class=\"kw\">except</span> Exception:            reason = <span class=\"str\">\"failed\"</span>\n<span class=\"com\"># вне async with — слот освобождён</span>\n<span class=\"kw\">if</span> reason <span class=\"kw\">and</span> on_error: <span class=\"kw\">await</span> on_error(reason)</code></pre>\n<div class=\"callout warn\"><div class=\"ctitle\">Нюанс</div>on_error вызывается ПОСЛЕ выхода из async with — слот уже свободен. Не держим ресурс пока отправляем сообщение об ошибке.</div>\n<h4>submit — fire-and-forget</h4>\n<pre><code>task = asyncio.create_task(self._run(...))\nself._tasks.add(task)                       <span class=\"com\"># храним — иначе GC убьёт</span>\ntask.add_done_callback(self._tasks.discard) <span class=\"com\"># сам удалится при завершении</span></code></pre>\n<p><button class=\"crumb-link\" onclick=\"show('c-firefor')\">Fire-and-forget &rarr;</button> &middot; <button class=\"crumb-link\" onclick=\"show('c-async')\">async/await &rarr;</button></p>\n"};
C["m-config"]={crumb:[['architecture', 'Архитектура']],title:"Конфигурация",file:"config.py",subtitle:"Единственное место чтения настроек из .env. Все модули берут settings отсюда.",body:"\n<h4>Предназначение</h4>\n<p>Объект <code class=\"inline\">settings</code> создаётся один раз при импорте и раздаётся всем модулям. <button class=\"crumb-link\" onclick=\"show('c-singleton')\">Почему один раз &rarr;</button></p>\n<pre><code><span class=\"kw\">class</span> <span class=\"fn\">Settings</span>(BaseSettings):\n    model_config = SettingsConfigDict(env_file=<span class=\"str\">\".env\"</span>, env_file_encoding=<span class=\"str\">\"utf-8\"</span>, extra=<span class=\"str\">\"ignore\"</span>)\n    telegram_bot_token: <span class=\"kw\">str</span>\n    task_timeout_sec: <span class=\"kw\">int</span> = <span class=\"str\">600</span>\n    img_diff_threshold: <span class=\"kw\">float</span> = <span class=\"str\">0.15</span></code></pre>\n<p><button class=\"crumb-link\" onclick=\"show('c-pydantic')\">Подробно о pydantic-settings &rarr;</button></p>\n<h4>@property — вычисляемые атрибуты</h4>\n<pre><code><span class=\"kw\">@property</span>\n<span class=\"kw\">def</span> <span class=\"fn\">max_image_bytes</span>(self): <span class=\"kw\">return</span> self.max_image_mb * <span class=\"str\">1024</span> * <span class=\"str\">1024</span></code></pre>\n<p>В .env хранится <code class=\"inline\">MAX_IMAGE_MB=10</code>. Property централизует конвертацию. Вызывается без скобок: <code class=\"inline\">settings.max_image_bytes</code>.</p>\n<h4>Нестандартное решение — ADMIN_IDS</h4>\n<div class=\"callout warn\"><div class=\"ctitle\">Проблема</div>pydantic-settings для list[int] требует строго JSON: [123,456]. Строка \"123,456\" упадёт.</div>\n<pre><code>admin_ids_raw: <span class=\"kw\">str</span> = Field(default=<span class=\"str\">\"\"</span>, validation_alias=AliasChoices(<span class=\"str\">\"ADMIN_IDS\"</span>, <span class=\"str\">\"admin_ids\"</span>))\n\n<span class=\"kw\">@property</span>\n<span class=\"kw\">def</span> <span class=\"fn\">admin_ids</span>(self):\n    raw = self.admin_ids_raw.strip()\n    <span class=\"kw\">if not</span> raw: <span class=\"kw\">return</span> []\n    <span class=\"kw\">if</span> raw.startswith(<span class=\"str\">\"[\"</span>): <span class=\"kw\">import</span> json; <span class=\"kw\">return</span> [<span class=\"kw\">int</span>(x) <span class=\"kw\">for</span> x <span class=\"kw\">in</span> json.loads(raw)]\n    <span class=\"kw\">return</span> [<span class=\"kw\">int</span>(p) <span class=\"kw\">for</span> p <span class=\"kw\">in</span> raw.replace(<span class=\"str\">\",\"</span>, <span class=\"str\">\" \"</span>).split()]</code></pre>\n<p>Принимаются все форматы: <code class=\"inline\">123</code>, <code class=\"inline\">123 456</code>, <code class=\"inline\">123,456</code>, <code class=\"inline\">[123,456]</code>.</p>\n"};
C["m-handlers"]={crumb:[['architecture', 'Архитектура']],title:"Обработчики",file:"bot/handlers.py",subtitle:"Центральный узел: Telegram-сообщение превращается в задачу на генерацию.",body:"\n<h4>Предназначение и связи</h4>\n<p>Стоит на границе Telegram &harr; бизнес-логика. Все зависимости приходят через <button class=\"crumb-link\" onclick=\"show('c-di')\">Deps &rarr;</button></p>\n<div class=\"arch-flow\">Telegram -> aiogram -> on_content()\n  +-- storage/db.py  -- авторизация\n  +-- routing.py     -- маршрут\n  +-- queue.py       -- фоновая задача\n  +-- _process()\n       +-- pipeline.run_text2html / run_img2html\n       +-- _send_artifact() -> Telegram</div>\n<h4>Декораторы aiogram</h4>\n<pre><code><span class=\"kw\">@router.message</span>(F.text | F.photo)\n<span class=\"kw\">async def</span> <span class=\"fn\">on_content</span>(message: Message) -&gt; <span class=\"kw\">None</span>: ...</code></pre>\n<p>Handlers проверяются сверху вниз. Командные стоят ВЫШЕ on_content, иначе /start попал бы туда как текст.</p>\n<h4>Auth gate</h4>\n<pre><code><span class=\"kw\">if not await</span> storage.is_authorized(uid):\n    candidate = (message.text <span class=\"kw\">or</span> message.caption <span class=\"kw\">or</span> <span class=\"str\">\"\"</span>).strip()\n    <span class=\"kw\">if</span> candidate == settings.auth_codeword:\n        <span class=\"kw\">await</span> storage.authorize(uid)\n    <span class=\"kw\">else</span>:\n        <span class=\"kw\">await</span> message.answer(<span class=\"str\">\"Wrong codeword.\"</span>)\n    <span class=\"kw\">return</span>  <span class=\"com\"># критично: без return код пойдёт генерировать HTML из пароля</span></code></pre>\n<h4>Fire-and-forget + замыкание</h4>\n<pre><code><span class=\"kw\">await</span> message.answer(<span class=\"str\">\"Got it, processing...\"</span>)\n\n<span class=\"kw\">async def</span> <span class=\"fn\">_notify_fail</span>(reason):     <span class=\"com\"># замыкание -- помнит message</span>\n    <span class=\"kw\">await</span> message.answer(...)\n\n_d().queue.submit(<span class=\"kw\">lambda</span>: _process(message, route), on_error=_notify_fail)\n<span class=\"com\"># on_content завершается -- НЕ ждёт _process</span></code></pre>\n<p><button class=\"crumb-link\" onclick=\"show('c-closure')\">Замыкания &rarr;</button> &middot; <button class=\"crumb-link\" onclick=\"show('c-firefor')\">fire-and-forget &rarr;</button></p>\n<h4>Независимые ветки в _process</h4>\n<pre><code><span class=\"kw\">if</span> route <span class=\"kw\">in</span> (Route.TEXT2HTML, Route.BOTH):\n    <span class=\"kw\">try</span>: artifacts.append(<span class=\"kw\">await</span> pipeline.run_text2html(...))\n    <span class=\"kw\">except</span> Exception: failures.append(<span class=\"str\">\"text->HTML\"</span>)\n<span class=\"kw\">if</span> route <span class=\"kw\">in</span> (Route.IMG2HTML, Route.BOTH):\n    <span class=\"kw\">try</span>: artifacts.append(<span class=\"kw\">await</span> pipeline.run_img2html(...))\n    <span class=\"kw\">except</span> Exception: failures.append(<span class=\"str\">\"image->HTML\"</span>)</code></pre>\n<div class=\"callout why\"><div class=\"ctitle\">Зачем отдельные try</div>Если текст-ветка упала — фото-ветка всё равно выполнится. Пользователь получит хотя бы один результат.</div>\n"};
C["m-retry"]={crumb:[['architecture', 'Архитектура']],title:"Повторные попытки",file:"core/retry.py",subtitle:"Экспоненциальный backoff для вызовов Claude API.",body:"\n<h4>Предназначение и связи</h4>\n<p>Используется только в <button class=\"crumb-link\" onclick=\"show('m-llm')\">llm.py</button> — оборачивает каждый вызов Anthropic API. Только API-вызовы подвержены сетевым ошибкам и rate limit.</p>\n<div class=\"arch-flow\">llm._call / llm._create\n  +- with_backoff(_do, exc_types=_RETRY_EXC)\n       попытка 1 -> ошибка -> ждём 1 сек (+jitter)\n       попытка 2 -> ошибка -> ждём 2 сек (+jitter)\n       попытка 3 -> ошибка -> ждём 4 сек (+jitter)\n       попытка 4 -> поднимаем исключение наверх</div>\n<h4>Формула задержки</h4>\n<pre><code>delay = min(max_delay, base_delay * (<span class=\"str\">2</span>**i)) + random.uniform(<span class=\"str\">0</span>, <span class=\"str\">0.5</span>)\n<span class=\"com\"># 0->1 сек, 1->2, 2->4, 3->8 (потолок 20 сек)</span></code></pre>\n<div class=\"callout\"><div class=\"ctitle\">Зачем jitter</div>10 клиентов получили rate limit и все ждут ровно 2 сек — они снова ударят одновременно. Случайный разброс 0–0.5 сек распределяет нагрузку.</div>\n<h4>TypeVar T</h4>\n<pre><code>T = TypeVar(<span class=\"str\">\"T\"</span>)\n<span class=\"kw\">async def</span> <span class=\"fn\">with_backoff</span>(fn: Callable[[], Awaitable[T]], ...) -&gt; T:</code></pre>\n<p>Говорит type checker: что fn возвращает — то и функция вернёт. <button class=\"crumb-link\" onclick=\"show('c-typevar')\">Подробнее &rarr;</button></p>\n"};
C["m-htmlutils"]={crumb:[['architecture', 'Архитектура']],title:"Очистка вывода модели",file:"core/html_utils.py",subtitle:"Детерминированно вырезает HTML из ответа Claude. Дешевле чем перезапрос.",body:"\n<h4>Предназначение и связи</h4>\n<ul>\n<li><button class=\"crumb-link\" onclick=\"show('m-llm')\">llm.py</button> &rarr; <code class=\"inline\">extract_html_document</code> после каждого API-ответа.</li>\n<li><button class=\"crumb-link\" onclick=\"show('m-render')\">render.py</button> &rarr; <code class=\"inline\">looks_like_html_document</code> перед рендером.</li>\n</ul>\n<div class=\"callout why\"><div class=\"ctitle\">Детерминизм дешевле перезапроса</div>Попросить Claude переотправить чистый HTML — платный API-вызов. Вырезать текстом — бесплатно, 0 токенов.</div>\n<h4>extract_html_document</h4>\n<pre><code><span class=\"kw\">def</span> <span class=\"fn\">extract_html_document</span>(text):\n    <span class=\"kw\">if</span> t.startswith(<span class=\"str\">\"```\"</span>): t = _FENCE_RE.sub(<span class=\"str\">\"\"</span>, t).strip()  <span class=\"com\"># убрать ```</span>\n    start = _DOCTYPE_RE.search(t) <span class=\"kw\">or</span> _HTML_OPEN_RE.search(t)\n    <span class=\"kw\">if not</span> start: <span class=\"kw\">return</span> t          <span class=\"com\"># нет маркеров -- validator отклонит</span>\n    close_idx = t.lower().rfind(<span class=\"str\">\"&lt;/html&gt;\"</span>)  <span class=\"com\"># rfind -- с конца</span>\n    <span class=\"kw\">return</span> t[start.start() : close_idx + <span class=\"str\">7</span>].strip()</code></pre>\n<p><code class=\"inline\">rfind</code> берёт последний &lt;/html&gt; — Claude мог написать несколько версий в одном ответе.</p>\n<h4>looks_like_html_document</h4>\n<pre><code><span class=\"kw\">def</span> <span class=\"fn\">looks_like_html_document</span>(html):\n    t = html.strip().lower()\n    <span class=\"kw\">if not</span> (t.startswith(<span class=\"str\">\"&lt;!doctype html\"</span>) <span class=\"kw\">or</span> t.startswith(<span class=\"str\">\"&lt;html\"</span>)): <span class=\"kw\">return False</span>\n    <span class=\"kw\">return</span> <span class=\"str\">\"&lt;/html&gt;\"</span> <span class=\"kw\">in</span> t</code></pre>\n<p>Только строковые операции. Вызывается до рендера — если мусор, Chromium не запускается. <button class=\"crumb-link\" onclick=\"show('c-cheapgate')\">Cheap gate &rarr;</button></p>\n"};
C["m-render"]={crumb:[['architecture', 'Архитектура']],title:"Рендер и валидация",file:"core/render.py",subtitle:"Один долгоживущий Chromium. Рендерит HTML -> PNG и проверяет на ошибки.",body:"\n<h4>Предназначение и связи</h4>\n<p>Создаётся в main.py, передаётся через <button class=\"crumb-link\" onclick=\"show('c-di')\">Deps</button> в <button class=\"crumb-link\" onclick=\"show('m-handlers')\">handlers</button>, затем в <button class=\"crumb-link\" onclick=\"show('m-pipeline')\">pipeline</button>.</p>\n<h4>Один браузер, много контекстов</h4>\n<pre><code><span class=\"kw\">async def</span> <span class=\"fn\">render</span>(self, html):\n    context = <span class=\"kw\">await</span> self._browser.new_context(...)  <span class=\"com\"># изолированная вкладка</span>\n    page = <span class=\"kw\">await</span> context.new_page()\n    <span class=\"kw\">try</span>:\n        <span class=\"kw\">await</span> page.set_content(html, wait_until=<span class=\"str\">\"networkidle\"</span>)\n        png = <span class=\"kw\">await</span> page.screenshot(full_page=<span class=\"kw\">True</span>)\n        <span class=\"kw\">return</span> RenderResult(png=png, ...)\n    <span class=\"kw\">finally</span>:\n        <span class=\"kw\">await</span> context.close()  <span class=\"com\"># всегда закрыть, даже при ошибке</span></code></pre>\n<div class=\"callout why\"><div class=\"ctitle\">Почему один браузер</div>Запуск Chromium — секунды и ~100 МБ RAM. Рендер страницы — миллисекунды. Браузер живёт всё время, контекст создаётся и уничтожается на каждый запрос. finally гарантирует закрытие.</div>\n<h4>Слушатели событий</h4>\n<pre><code>page.on(<span class=\"str\">\"console\"</span>, <span class=\"kw\">lambda</span> m: errors.append(m.text) <span class=\"kw\">if</span> m.type==<span class=\"str\">\"error\"</span> <span class=\"kw\">else None</span>)\npage.on(<span class=\"str\">\"pageerror\"</span>, <span class=\"kw\">lambda</span> e: errors.append(<span class=\"fn\">str</span>(e)))</code></pre>\n<h4>validate — двухуровневый gate</h4>\n<pre><code><span class=\"kw\">async def</span> <span class=\"fn\">validate</span>(renderer, html):\n    <span class=\"kw\">if not</span> looks_like_html_document(html): <span class=\"kw\">raise</span> RenderError(...)  <span class=\"com\"># бесплатно</span>\n    result = <span class=\"kw\">await</span> renderer.render(html)   <span class=\"com\"># Chromium -- дорого</span>\n    <span class=\"kw\">if</span> result.console_errors: <span class=\"kw\">raise</span> RenderError(<span class=\"str\">\"console errors...\"</span>)\n    <span class=\"kw\">return</span> result</code></pre>\n<p><button class=\"crumb-link\" onclick=\"show('c-cheapgate')\">Cheap gate &rarr;</button></p>\n"};
C["m-compare"]={crumb:[['architecture', 'Архитектура'], ['m-pipeline', 'pipeline.py']],title:"Тайловое сравнение",file:"core/compare.py",subtitle:"Отвечает: насколько рендер отличается от оригинала и в каких местах.",body:"\n<h4>Предназначение и связи</h4>\n<p>Используется только в <button class=\"crumb-link\" onclick=\"show('m-pipeline')\">pipeline.run_img2html</button>. Принимает байты двух изображений, возвращает оценку по тайлам и список проблемных зон. Эти зоны pipeline передаёт Claude в следующем запросе коррекции.</p>\n<h4>Зачем тайлы, а не одно число</h4>\n<pre><code><span class=\"com\"># Сетка 3x3:</span>\n+-----+-----+-----+\n| r1c1| r1c2| r1c3|   score r2c3 = 0.23 &gt; threshold\n+-----+-----+-----+        v\n| r2c1| r2c2| r2c3|   problem_tiles = [\"r2c3\"]\n+-----+-----+-----+        v\n| r3c1| r3c2| r3c3|   Claude: \"исправь правый нижний угол\"\n+-----+-----+-----+</code></pre>\n<p>Общее число говорит «есть различия». Тайлы говорят «вот где именно». Без локализации Claude исправлял бы наугад.</p>\n<h4>_mean_diff</h4>\n<pre><code>diff = ImageChops.difference(a, b)  <span class=\"com\"># |a-b| для каждого пикселя</span>\nhist = diff.histogram()             <span class=\"com\"># гистограмма разностей</span>\n<span class=\"kw\">return</span> total / (<span class=\"str\">3</span> * pixels * <span class=\"str\">255</span>)  <span class=\"com\"># нормализуем в 0..1</span></code></pre>\n"};
C["m-llm"]={crumb:[['architecture', 'Архитектура'], ['m-pipeline', 'pipeline.py']],title:"Claude API",file:"core/llm.py",subtitle:"Единственное место вызовов Anthropic. Управляет историей разговора и prompt cache.",body:"\n<h4>Предназначение и связи</h4>\n<p>Только llm.py говорит с Claude. Вызывается из <button class=\"crumb-link\" onclick=\"show('m-pipeline')\">pipeline.py</button>. Использует <button class=\"crumb-link\" onclick=\"show('m-retry')\">retry.py</button> и <button class=\"crumb-link\" onclick=\"show('m-htmlutils')\">html_utils.py</button>.</p>\n<h4>Четыре публичные функции</h4>\n<ul>\n<li><code class=\"inline\">text_to_html(prompt, error_feedback)</code> — TEXT2HTML: один запрос, один ответ.</li>\n<li><code class=\"inline\">start_image_conversation(image_bytes, media_type)</code> — IMG2HTML шаг 1: открывает разговор, возвращает (html, messages).</li>\n<li><code class=\"inline\">correct_in_conversation(messages, render_bytes, problem_tiles)</code> — шаг 4: добавляет ход коррекции.</li>\n<li><code class=\"inline\">regenerate_clean(messages, reason)</code> — fallback: просит переслать только HTML.</li>\n</ul>\n<h4>Вложенная функция как стратегия retry</h4>\n<pre><code><span class=\"kw\">async def</span> <span class=\"fn\">_call</span>(system, content):\n    <span class=\"kw\">async def</span> <span class=\"fn\">_do</span>():                    <span class=\"com\"># замыкание -- захватывает system, content</span>\n        msg = <span class=\"kw\">await</span> _client.messages.create(...)\n        <span class=\"kw\">return</span> _extract_text(msg)\n    <span class=\"kw\">return await</span> with_backoff(_do, exc_types=_RETRY_EXC)</code></pre>\n<p><button class=\"crumb-link\" onclick=\"show('c-closure')\">Замыкания &rarr;</button></p>\n<h4>Prompt caching</h4>\n<pre><code><span class=\"kw\">def</span> <span class=\"fn\">_set_single_cache_breakpoint</span>(messages):\n    <span class=\"kw\">for</span> m <span class=\"kw\">in</span> messages:                  <span class=\"com\"># 1. убрать все старые метки</span>\n        <span class=\"kw\">for</span> block <span class=\"kw\">in</span> m.get(<span class=\"str\">\"content\"</span>, []):\n            block.pop(<span class=\"str\">\"cache_control\"</span>, <span class=\"kw\">None</span>)\n    <span class=\"kw\">for</span> m <span class=\"kw\">in</span> reversed(messages):       <span class=\"com\"># 2. метка на последний user-блок</span>\n        <span class=\"kw\">if</span> m[<span class=\"str\">\"role\"</span>] == <span class=\"str\">\"user\"</span>:\n            m[<span class=\"str\">\"content\"</span>][-<span class=\"str\">1</span>][<span class=\"str\">\"cache_control\"</span>] = {<span class=\"str\">\"type\"</span>: <span class=\"str\">\"ephemeral\"</span>}\n            <span class=\"kw\">return</span></code></pre>\n<p><button class=\"crumb-link\" onclick=\"show('c-promptcache')\">Подробный разбор &rarr;</button></p>\n"};
C["m-pipeline"]={crumb:[['architecture', 'Архитектура']],title:"Оркестратор генерации",file:"core/pipeline.py",subtitle:"Единственный модуль core/ который вызывается из handlers. Координирует llm, render, compare.",body:"\n<h4>Предназначение и связи</h4>\n<p>Входная точка для <button class=\"crumb-link\" onclick=\"show('m-handlers')\">handlers._process</button>. Координирует три модуля:</p>\n<div class=\"arch-flow\">handlers._process()\n  +- pipeline.run_text2html(renderer, text)\n  +- pipeline.run_img2html(renderer, image_bytes, media_type)\n       v использует:\n  llm.py     -- вызовы Claude\n  render.py  -- Chromium рендер\n  compare.py -- тайловая диагностика</div>\n<h4>TEXT2HTML — простой цикл до 3 попыток</h4>\n<pre><code><span class=\"kw\">for</span> attempt <span class=\"kw\">in</span> range(_VALIDATION_RETRIES + <span class=\"str\">1</span>):\n    html = <span class=\"kw\">await</span> llm.text_to_html(prompt, error_feedback=error)\n    <span class=\"kw\">try</span>:\n        result = <span class=\"kw\">await</span> validate(renderer, html)\n        <span class=\"kw\">return</span> Artifact(kind=<span class=\"str\">\"text2html\"</span>, html=html, png=result.png)\n    <span class=\"kw\">except</span> RenderError <span class=\"kw\">as</span> exc:\n        error = <span class=\"fn\">str</span>(exc)  <span class=\"com\"># передаём ошибку в следующую попытку</span></code></pre>\n<h4>IMG2HTML — цикл коррекции</h4>\n<pre><code>html, messages = <span class=\"kw\">await</span> llm.start_image_conversation(image_bytes, media_type)\nrender_png = (<span class=\"kw\">await</span> renderer.render(html)).png\n\nprev_overall = <span class=\"str\">1.0</span>\n<span class=\"kw\">for</span> it <span class=\"kw\">in</span> range(settings.img_max_iters):\n    cmp = compare.compare(image_bytes, render_png, grid, threshold)\n    <span class=\"kw\">if</span> (cmp.overall &lt; threshold          <span class=\"com\"># уже хорошо</span>\n        <span class=\"kw\">or not</span> cmp.problem_tiles         <span class=\"com\"># нет проблем</span>\n        <span class=\"kw\">or</span> cmp.overall &gt;= prev_overall): <span class=\"com\"># не улучшается</span>\n        <span class=\"kw\">break</span>                            <span class=\"com\"># &lt;-- дешёвый gate</span>\n    prev_overall = cmp.overall\n    new_html, messages = <span class=\"kw\">await</span> llm.correct_in_conversation(messages, render_png, cmp.problem_tiles)\n    html, render_png = new_html, new_result.png</code></pre>\n<div class=\"callout why\"><div class=\"ctitle\">Три условия остановки</div>\n<ul style=\"margin:6px 0 0 16px\">\n<li>overall &lt; threshold — платить за коррекцию не нужно</li>\n<li>not problem_tiles — нечего исправлять</li>\n<li>overall &ge; prev_overall — модель не улучшает, дальше бессмысленно</li>\n</ul>\n<button class=\"crumb-link\" onclick=\"show('c-cheapgate')\">Cheap gate &rarr;</button></div>\n"};
C["c-async"]={crumb:[['m-queue', 'queue.py']],title:"async / await",file:"",subtitle:"Как один поток делает много дел без блокировки.",body:"\n<h4>Проблема синхронного кода</h4>\n<pre><code><span class=\"kw\">def</span> <span class=\"fn\">скачать</span>():\n    time.sleep(<span class=\"str\">3</span>)  <span class=\"com\"># процессор ЗАБЛОКИРОВАН на 3 сек, ничего другого</span></code></pre>\n<h4>Решение</h4>\n<pre><code><span class=\"kw\">async def</span> <span class=\"fn\">скачать</span>():\n    <span class=\"kw\">await</span> asyncio.sleep(<span class=\"str\">3</span>)  <span class=\"com\"># \"жду, займись другим\"</span></code></pre>\n<div class=\"callout\"><div class=\"ctitle\">Аналогия — повар</div>Синхронный повар поставил воду и смотрит на кастрюлю. Async повар поставил воду, пошёл резать овощи, закипело — вернулся. Один повар, никакой блокировки. Одновременно делает только одно — просто быстро переключается.</div>\n<h4>Три правила</h4>\n<ol>\n<li><b>async def = корутина.</b> Вызов f() НЕ запускает код, только создаёт объект. Запускают через await или asyncio.create_task.</li>\n<li><b>await только внутри async def.</b> Иначе SyntaxError.</li>\n<li><b>Переключение только в точках await.</b> Между ними — без прерываний.</li>\n</ol>\n<pre><code><span class=\"kw\">async def</span> <span class=\"fn\">задача</span>():\n    x = <span class=\"str\">1</span> + <span class=\"str\">1</span>            <span class=\"com\"># никто не перебьёт</span>\n    <span class=\"kw\">await</span> asyncio.sleep(<span class=\"str\">0</span>) <span class=\"com\"># &lt;-- здесь могут переключиться</span>\n    z = x + <span class=\"str\">1</span>            <span class=\"com\"># снова без прерываний</span></code></pre>\n"};
C["c-enum"]={crumb:[['m-routing', 'routing.py']],title:"Enum и множественное наследование",file:"",subtitle:"Почему class Route(str, Enum), а не просто Enum.",body:"\n<h4>Обычный Enum</h4>\n<pre><code><span class=\"kw\">class</span> <span class=\"fn\">Route</span>(Enum):\n    TEXT2HTML = <span class=\"str\">\"text2html\"</span>\nr = Route.TEXT2HTML\nprint(r)                  <span class=\"com\"># Route.TEXT2HTML -- имя, не значение</span>\nprint(r == <span class=\"str\">\"text2html\"</span>)  <span class=\"com\"># False -- НЕ равно строке!</span></code></pre>\n<h4>С наследованием от str</h4>\n<pre><code><span class=\"kw\">class</span> <span class=\"fn\">Route</span>(<span class=\"kw\">str</span>, Enum):  <span class=\"com\"># одновременно И str, И Enum</span>\n    TEXT2HTML = <span class=\"str\">\"text2html\"</span>\nr = Route.TEXT2HTML\nprint(r)                  <span class=\"com\"># text2html -- сразу значение</span>\nprint(r == <span class=\"str\">\"text2html\"</span>)  <span class=\"com\"># True</span></code></pre>\n<div class=\"callout why\"><div class=\"ctitle\">Польза</div>Route.TEXT2HTML попадает в Artifact.kind (тип str) без .value. Python строит класс с двумя родителями, наследующий поведение обоих.</div>\n"};
C["c-di"]={crumb:[['m-handlers', 'handlers.py']],title:"Dependency injection вручную",file:"",subtitle:"Deps-контейнер: зависимости приходят извне, модуль их не создаёт.",body:"\n<pre><code><span class=\"kw\">@dataclass</span>\n<span class=\"kw\">class</span> <span class=\"fn\">Deps</span>:\n    bot: Bot; renderer: Renderer; queue: TaskQueue\n\n_deps: Deps | <span class=\"kw\">None</span> = <span class=\"kw\">None</span>\n\n<span class=\"kw\">def</span> <span class=\"fn\">init</span>(deps: Deps):\n    <span class=\"kw\">global</span> _deps; _deps = deps  <span class=\"com\"># main.py зовёт раз при старте</span>\n\n<span class=\"kw\">def</span> <span class=\"fn\">_d</span>() -&gt; Deps:\n    <span class=\"kw\">assert</span> _deps <span class=\"kw\">is not None</span>; <span class=\"kw\">return</span> _deps</code></pre>\n<p><code class=\"inline\">global</code> — без него строка <code class=\"inline\">_deps = deps</code> создала бы локальную переменную внутри функции, которая исчезла бы на выходе.</p>\n<div class=\"callout why\"><div class=\"ctitle\">Зачем DI</div>handlers не создаёт Bot/Renderer/Queue сам — получает готовыми. В тестах можно подменить реальные объекты на моки. Слабая связанность.</div>\n"};
C["c-singleton"]={crumb:[['m-config', 'config.py']],title:"Модуль как синглтон",file:"",subtitle:"Почему settings создаётся один раз, хотя config импортируется отовсюду.",body:"\n<h4>Механизм sys.modules</h4>\n<pre><code><span class=\"com\"># При import config:</span>\n<span class=\"str\">1.</span> Смотрит в sys.modules -- есть \"config\"?\n<span class=\"str\">2.</span> ДА  -> возвращает готовый объект, config.py НЕ выполняется\n<span class=\"str\">3.</span> НЕТ -> выполняет config.py, кладёт в sys.modules</code></pre>\n<h4>Доказательство</h4>\n<pre><code><span class=\"com\"># в трёх разных файлах:</span>\n<span class=\"kw\">from</span> config <span class=\"kw\">import</span> settings\nprint(id(settings))  <span class=\"com\"># одно и то же число везде -- один объект в памяти</span></code></pre>\n<div class=\"callout why\"><div class=\"ctitle\">Почему важно</div>Если бы каждый импорт создавал новый Settings() — изменение в одном месте не видели бы другие. Строка settings = Settings() на уровне модуля и есть синглтон.</div>\n"};
C["c-closure"]={crumb:[['m-handlers', 'handlers.py']],title:"Замыкания (closures)",file:"",subtitle:"Вложенная функция «помнит» переменные из внешней области.",body:"\n<pre><code><span class=\"kw\">async def</span> <span class=\"fn\">on_content</span>(message):\n    <span class=\"kw\">async def</span> <span class=\"fn\">_notify_fail</span>(reason):\n        <span class=\"kw\">await</span> message.answer(...)  <span class=\"com\"># откуда message? из внешней функции!</span>\n    queue.submit(<span class=\"kw\">lambda</span>: _process(message, route), on_error=_notify_fail)</code></pre>\n<p><code class=\"inline\">_notify_fail</code> определена внутри on_content. Когда позже очередь вызовет on_error(\"timeout\") — функция всё ещё «помнит» к какому message отправить ответ.</p>\n<div class=\"callout\"><div class=\"ctitle\">Простыми словами</div>Замыкание — функция плюс «снимок» окружающих переменных, который она уносит с собой и использует позже, даже когда внешняя функция уже завершилась.</div>\n"};
C["c-pydantic"]={crumb:[['m-config', 'config.py']],title:"pydantic-settings",file:"",subtitle:"Декларативное чтение настроек с проверкой типов.",body:"\n<h4>Вместо ручного os.environ</h4>\n<pre><code><span class=\"com\"># вручную:</span>\ntimeout = int(os.environ.get(<span class=\"str\">\"TASK_TIMEOUT_SEC\"</span>, <span class=\"str\">\"600\"</span>))\n<span class=\"com\"># декларативно:</span>\ntask_timeout_sec: <span class=\"kw\">int</span> = <span class=\"str\">600</span></code></pre>\n<dl class=\"term\">\n<dt>env_file=\".env\"</dt><dd>Откуда читать. Приоритет: os.environ &rarr; .env &rarr; дефолт.</dd>\n<dt>env_file_encoding=\"utf-8\"</dt><dd>Кодировка. На Windows дефолт cp1252 — кириллица станет кракозябрами.</dd>\n<dt>extra=\"ignore\"</dt><dd>Лишние переменные в .env — пропустить. .env может содержать переменные для других инструментов.</dd>\n</dl>\n<div class=\"callout why\"><div class=\"ctitle\">Fail fast</div>При Settings() всё читается сразу. Ошибка типа — падение при старте с понятным сообщением, а не в середине работы.</div>\n"};
C["c-firefor"]={crumb:[['m-queue', 'queue.py'], ['m-handlers', 'handlers.py']],title:"Fire-and-forget",file:"",subtitle:"Запустить задачу в фон и сразу вернуться, не ожидая результата.",body:"\n<pre><code><span class=\"kw\">await</span> message.answer(<span class=\"str\">\"Got it, processing...\"</span>)  <span class=\"com\"># 1. отвечаем</span>\nqueue.submit(<span class=\"kw\">lambda</span>: _process(...))              <span class=\"com\"># 2. задача в фон</span>\n<span class=\"com\"># 3. on_content завершается -- бот свободен</span></code></pre>\n<h4>Почему lambda, а не корутина напрямую</h4>\n<p>submit принимает функцию которая создаёт корутину при вызове, а не готовую корутину. Фабричный паттерн: «создай задачу когда придёт время (освободится слот)».</p>\n<pre><code>task = asyncio.create_task(self._run(...))\nself._tasks.add(task)                       <span class=\"com\"># храним -- иначе GC убьёт</span>\ntask.add_done_callback(self._tasks.discard) <span class=\"com\"># сам удалится при завершении</span></code></pre>\n"};
C["c-promptcache"]={crumb:[['m-llm', 'llm.py']],title:"Prompt caching",file:"",subtitle:"Повторное использование prefix-контекста за ~10% стоимости.",body:"\n<h4>Проблема без кэша</h4>\n<pre><code>Итерация 1: [картинка 500кб] + [рендер] -> Claude -> HTML v1\nИтерация 2: [картинка 500кб] + [HTML v1] + [рендер] -> HTML v2\nИтерация 3: [картинка 500кб] + [HTML v1] + [HTML v2] + [рендер] -> HTML v3\n<span class=\"com\"># картинка оплачивается трижды полной ценой</span></code></pre>\n<div class=\"callout why\"><div class=\"ctitle\">Решение</div>Ставим метку cache_control на последний блок последнего user-хода. Anthropic кэширует весь prefix до этой точки. Следующий вызов с тем же prefix читает его за ~10% стоимости.</div>\n<pre><code><span class=\"com\"># Итерация 1: метка на конце первого user-хода:</span>\n[{role:<span class=\"str\">\"user\"</span>, content:[..картинка.., {text:<span class=\"str\">\"Reproduce...\"</span>, cache_control:{...}}]},\n {role:<span class=\"str\">\"assistant\"</span>, content:<span class=\"str\">\"HTML v1\"</span>}]\n\n<span class=\"com\"># Итерация 2: метка ПЕРЕСТАВЛЯЕТСЯ на новый user-ход:</span>\n[{role:<span class=\"str\">\"user\"</span>, content:[..картинка.., {text:<span class=\"str\">\"Reproduce...\"</span>}]},  <span class=\"com\"># метка убрана</span>\n {role:<span class=\"str\">\"assistant\"</span>, content:<span class=\"str\">\"HTML v1\"</span>},\n {role:<span class=\"str\">\"user\"</span>, content:[..рендер.., {text:<span class=\"str\">\"Problem zones: r2c3\"</span>, cache_control:{...}}]}]\n<span class=\"com\"># Prefix до метки = картинка + HTML v1 -> читается за 10%</span></code></pre>\n<h4>Почему метка всегда одна</h4>\n<p>Кэш — prefix match. Несколько меток = несколько prefix-ов. Нужен ровно один — на самой дальней точке роста разговора.</p>\n"};
C["c-conversation"]={crumb:[['m-llm', 'llm.py'], ['m-pipeline', 'pipeline.py']],title:"Многооборотный разговор с Claude",file:"",subtitle:"API не хранит историю — передаёшь всё сам в каждом запросе.",body:"\n<h4>Как устроен API</h4>\n<p>Anthropic API stateless: каждый вызов независим. Чтобы модель «помнила» — передаёшь всю историю в каждом запросе.</p>\n<pre><code>messages = [\n  {<span class=\"str\">\"role\"</span>: <span class=\"str\">\"user\"</span>,      <span class=\"str\">\"content\"</span>: <span class=\"str\">\"вот оригинал: [картинка]\"</span>},\n  {<span class=\"str\">\"role\"</span>: <span class=\"str\">\"assistant\"</span>, <span class=\"str\">\"content\"</span>: <span class=\"str\">\"&lt;!DOCTYPE html&gt;...v1...\"</span>},\n  {<span class=\"str\">\"role\"</span>: <span class=\"str\">\"user\"</span>,      <span class=\"str\">\"content\"</span>: <span class=\"str\">\"рендер: [PNG], проблемы: r2c3\"</span>},\n]</code></pre>\n<div class=\"callout\"><div class=\"ctitle\">HTML не пересылается</div>Текущий HTML живёт в истории как последний assistant-ход. В следующем user-ходе его не нужно копировать. В сочетании с <button class=\"crumb-link\" onclick=\"show('c-promptcache')\">prompt caching</button> — максимальная экономия токенов.</div>\n"};
C["c-cheapgate"]={crumb:[['m-pipeline', 'pipeline.py'], ['m-render', 'render.py']],title:"Cheap gate",file:"",subtitle:"Бесплатная проверка перед дорогой операцией.",body:"\n<h4>Gate 1 — перед рендером</h4>\n<pre><code><span class=\"kw\">if not</span> looks_like_html_document(html):  <span class=\"com\"># строки -- бесплатно</span>\n    <span class=\"kw\">raise</span> RenderError(...)\nresult = <span class=\"kw\">await</span> renderer.render(html)   <span class=\"com\"># Chromium -- дорого</span></code></pre>\n<h4>Gate 2 — перед коррекцией</h4>\n<pre><code><span class=\"kw\">if</span> (cmp.overall &lt; threshold <span class=\"kw\">or not</span> cmp.problem_tiles <span class=\"kw\">or</span> cmp.overall &gt;= prev_overall):\n    <span class=\"kw\">break</span>  <span class=\"com\"># compare -- бесплатно</span>\nnew_html = <span class=\"kw\">await</span> llm.correct_in_conversation(...)  <span class=\"com\"># API -- дорого</span></code></pre>\n<div class=\"callout why\"><div class=\"ctitle\">Общий принцип</div>Сортируй операции по стоимости. Самые дешёвые — первыми. Дорогие запускай только когда дешёвые пропустили. Универсальный паттерн оптимизации.</div>\n"};
C["c-typevar"]={crumb:[['m-retry', 'retry.py']],title:"TypeVar — обобщённые типы",file:"",subtitle:"Как функция сохраняет информацию о типе возврата.",body:"\n<pre><code><span class=\"com\"># без TypeVar:</span>\n<span class=\"kw\">async def</span> <span class=\"fn\">with_backoff</span>(fn) -&gt; Any:   <span class=\"com\"># IDE не знает тип результата</span>\n    <span class=\"kw\">return await</span> fn()\n\n<span class=\"com\"># с TypeVar:</span>\nT = TypeVar(<span class=\"str\">\"T\"</span>)\n<span class=\"kw\">async def</span> <span class=\"fn\">with_backoff</span>(fn: Callable[[], Awaitable[T]]) -&gt; T:\n    <span class=\"kw\">return await</span> fn()\n\nresult = <span class=\"kw\">await</span> with_backoff(get_html)  <span class=\"com\"># IDE знает: result -- str</span></code></pre>\n<div class=\"callout\"><div class=\"ctitle\">Простыми словами</div>T говорит: тип возврата = тип того что вернёт fn. Если fn возвращает str — функция вернёт str. Это generics.</div>\n"};
C["glossary"]={crumb:[['overview', 'Обзор']],title:"Словарь терминов",file:"",subtitle:"Все термины из разбора в одном месте.",body:"<dl class='term'><dt>Корутина (coroutine)</dt><dd>Функция объявленная async def. При вызове не выполняется, а возвращает объект, который запускают через await или create_task.</dd><dt>Event loop</dt><dd>Планировщик asyncio. Переключается между задачами в точках await, создавая иллюзию параллельности в одном потоке.</dd><dt>Semaphore</dt><dd>Счётчик-ограничитель. Semaphore(3) пропускает максимум 3 одновременно, остальные ждут.</dd><dt>Fire-and-forget</dt><dd>Запустить задачу в фон и сразу вернуть управление, не дожидаясь результата.</dd><dt>Замыкание (closure)</dt><dd>Вложенная функция + снимок переменных внешней области, который она использует позже.</dd><dt>Чистая функция</dt><dd>Без побочных эффектов: одинаковый вход — одинаковый выход, не трогает БД/сеть/файлы.</dd><dt>Dependency injection</dt><dd>Зависимости передаются объекту извне, а не создаются им. Даёт слабую связанность и тестируемость.</dd><dt>Синглтон</dt><dd>Один экземпляр на всё приложение. В Python модуль — синглтон by design.</dd><dt>Separation of Concerns</dt><dd>Разделение ответственности: bot/ знает Telegram, core/ знает генерацию.</dd><dt>Fail fast</dt><dd>Падать как можно раньше с понятной ошибкой, а не молча работать неправильно.</dd><dt>Keyword-only аргументы</dt><dd>После * в сигнатуре — передаются только по имени. Защита от перепутанного порядка.</dd><dt>@property</dt><dd>Метод, вызываемый как атрибут (без скобок). Для вычисляемых значений.</dd><dt>@dataclass</dt><dd>Декоратор, автогенерирующий __init__ и др. для класса-контейнера.</dd><dt>Decorator</dt><dd>Обёртка @something над функцией. В aiogram @router.message(...) привязывает handler к событию.</dd><dt>Graceful shutdown</dt><dd>Чистое завершение: дождаться задач (drain), закрыть ресурсы, потом выйти.</dd><dt>structlog</dt><dd>Структурное логирование: пишет JSON с полями (task=name), а не плоский текст.</dd><dt>long-polling</dt><dd>Бот сам периодически спрашивает сервер о новых сообщениях (в отличие от webhook).</dd><dt>Prompt caching</dt><dd>Механизм Anthropic API: повторное использование неизменённого prefix-контекста за ~10% стоимости.</dd><dt>Stateless API</dt><dd>API не хранит состояние между вызовами. Историю передаёшь сам в каждом запросе.</dd><dt>Cheap gate</dt><dd>Дешёвая проверка перед дорогой операцией. Отсеивает плохие случаи без затрат.</dd><dt>TypeVar</dt><dd>Переменная типа. Связывает тип аргумента с типом возврата в обобщённых функциях.</dd><dt>base64</dt><dd>Кодировка бинарных данных в ASCII-строку. Используется для передачи изображений в JSON-API.</dd><dt>Playwright</dt><dd>Библиотека управления браузером. Headless-рендер HTML в PNG.</dd><dt>Headless браузер</dt><dd>Браузер без GUI. Рендерит страницы, делает скриншоты — без визуального окна.</dd><dt>Тайл (tile)</dt><dd>Прямоугольный фрагмент изображения. Сетка N×N тайлов для локализации различий.</dd><dt>Джиттер (jitter)</dt><dd>Случайный разброс во времени. В backoff предотвращает одновременный повтор запросов.</dd></dl>"};

function show(id){
  var d=C[id]; if(!d)return;
  var m=document.getElementById('main');
  var old=document.getElementById('sec'); if(old)old.remove();
  var s=document.createElement('div'); s.id='sec'; s.className='section visible';
  var cr='<div class="crumb"><button onclick="show(\'overview\')">Обзор</button>';
  (d.crumb||[]).forEach(function(c){cr+=' &rsaquo; <button onclick="show(\''+c[0]+'\')">'+c[1]+'</button>';});
  cr+=' &rsaquo; <span>'+d.title+'</span></div>';
  var ft=d.file?(' <span class="file-tag">'+d.file+'</span>'):'';
  s.innerHTML=cr+'<h1>'+d.title+ft+'</h1><div class="subtitle">'+d.subtitle+'</div>'+d.body;
  m.appendChild(s);
  document.querySelectorAll('.nav-link').forEach(function(l){l.classList.toggle('active',l.dataset.id===id);});
  window.scrollTo(0,0);
}
function buildNav(){
  var sb=document.getElementById('sb');
  NAV.forEach(function(grp){
    var h=document.createElement('h2'); h.textContent=grp.g; sb.appendChild(h);
    grp.items.forEach(function(it){
      var b=document.createElement('button'); b.className='nav-link'; b.textContent=it.label; b.dataset.id=it.id;
      b.onclick=function(){show(it.id);}; sb.appendChild(b);
    });
  });
}
buildNav(); show('overview');
