services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/auth.db
    volumes:
      - bot-data:/app/data
    # Chromium needs a bit of shared memory for headless rendering.
    shm_size: "512mb"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  bot-data:
